# Running the website on Render, which is free and needs no card.
#
# Python directly rather than the Docker image: Render installs the requirements
# and starts the server itself, which is fewer moving parts and a faster build.
# Dockerfile.web is still what App Runner uses on AWS, and the two run the same
# command in the end.
#
# This is the local-storage version of the site: submissions live in a sqlite
# file and decks are processed in a background thread, the same way they are on a
# laptop. Render replaces the disk whenever the service restarts, so submissions
# do not survive one. That is fine for showing people the tool and is not how it
# should be run for real: the AWS setup under infra/ is.
#
# Older .ppt files are turned away here, because converting one needs LibreOffice
# and that only lives in the pipeline image. .pptx is unaffected.
services:
  - type: web
    name: accessibility-enhancer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # the website never opens a deck itself, but it does describe the pictures,
      # so it needs to reach Bedrock. These two are the access key for the
      # bedrock-captioning-only user, and are typed into the Render dashboard
      # rather than written here, because this file is in the repository.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # us-east-1 is where Bedrock answers. Asking any other region for these
      # models comes back "the model does not exist".
      - key: BEDROCK_REGION
        value: us-east-1

      # Signs the session cookie, which is how a visitor sees their own
      # submissions and nobody else's. Generated once by Render and kept, so a
      # restart does not log everybody out.
      - key: SECRET_KEY
        generateValue: true

      # the console is where Render collects logs from, so nothing should be
      # written to a file
      - key: LOG_FILE
        value: ""

      - key: DEBUG
        value: "false"
